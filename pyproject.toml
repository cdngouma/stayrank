[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-stayrank"
version = "0.1.0"
description = "An agentic AI system for personalized travel accommodation recommendations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "cdngouma" }
]

dependencies = [
    "duckdb>=1.3",
    "pandas>=2.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]